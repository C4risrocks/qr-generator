name: Publish (GHCR, optional)

# Optional path for digest-pinned deployments: publish an immutable image
# built from a tested commit. Configure the Dokploy Application with
# "Docker Image" as source and point it at one of these tags (or its
# digest). The default Git + Dockerfile flow keeps working unchanged.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify CI is green for this commit
        run: |
          # Fail closed: never publish an image for a commit without a
          # successful CI run from a real push to main of this repository.
          COUNT=$(curl -fsS -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&branch=main&status=success&per_page=5" \
            | jq -r --arg repo "${{ github.repository }}" '[.workflow_runs[]
              | select(.conclusion == "success"
                and .event == "push"
                and .head_branch == "main"
                and .head_repository.full_name == $repo)] | length')
          if [ "${COUNT:-0}" -lt 1 ]; then
            echo "Refusing to publish: no successful CI run on main for ${GITHUB_SHA}" >&2
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Drop .git before building
        run: rm -rf .git
        # The commit identity is passed as GIT_SHA below, so the history
        # never reaches the build context or BuildKit cache.

      - name: Compute tags
        id: tags
        run: |
          # Always publish an immutable per-commit tag; version tags add a
          # human-readable one on top. Image references must be lowercase
          # even when the GitHub owner name is not.
          REPO_LOWER="$(printf '%s' "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          TAGS="ghcr.io/${REPO_LOWER}:sha-${GITHUB_SHA}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAGS="$TAGS
          ghcr.io/${REPO_LOWER}:${GITHUB_REF_NAME}"
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}

      - name: Report digest
        run: |
          echo "Published digest: ${{ steps.build.outputs.digest }}"
          echo "Pin Dokploy to ghcr.io/$(printf '%s' "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')@${{ steps.build.outputs.digest }} for an immutable deploy."
